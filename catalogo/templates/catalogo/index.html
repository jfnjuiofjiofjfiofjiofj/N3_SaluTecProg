{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Minha confeitaria</title>
    <link rel="stylesheet" href="{% static 'catalogo/style.css' %}">
</head>
<body>
    <h1>Bem-vindo a Minha Confeitaria</h1>
    <p>Escolha uma das opções abaixo:</p>
    <ul>
        <li>
         <a href="{% url 'catalogo:lista_bolos' %}">Nossos Bolos</a>
        </li>
        <li>
        <a href="{% url 'catalogo:novo_bolo' %}">Novo Bolo</a>
        </li>
    </ul>
    {% if user.is_authenticated %}
        <p>Você está logado como: {{ user.username }}</p>
        <a href="{% url 'logout' %}">Sair</a>
    {% else %}
        <p>Você não está logado.</p>
        <a href="{% url 'login' %}">Entrar</a>
        <a href="{% url 'catalogo:registro' %}">Criar conta</a>
    {% endif %}
</body>
</html>
