{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="{% static 'catalogo/style.css' %}">
</head>
<body>

    <div>Login de Funcionário</div>

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Entrar</button>
    </form>

    <a href="{% url 'catalogo:registro' %}">
        Não possui conta? Cadastre-se
    </a>

</body>
</html>
